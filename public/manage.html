<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Manage Booking | True Radiance Beauty Salon and Spa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{--primary:#7f1839;--pc:#9e3150;--bg:#fff5f7;--tint:#fce7eb;--ink:#4a3b40;--rose:#e17a94;--gold:#d4af37}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink)}
  header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;background:rgba(255,245,247,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(225,122,148,.2)}
  header img{height:64px;width:auto} header a{color:var(--primary);font-weight:600;font-size:.875rem;text-decoration:none}
  main{display:grid;place-items:center;padding:2rem 1rem}
  .card{width:100%;max-width:480px;background:#fff;border-radius:2rem;padding:2.25rem 2rem;border:1px solid rgba(225,122,148,.15);box-shadow:0 20px 45px rgba(74,59,64,.08)}
  h1{font-family:'Playfair Display',serif;color:var(--primary);font-weight:600;font-size:2rem;margin:0 0 .25rem}
  p.sub{margin:0 0 1.5rem;font-size:.875rem;color:#6b575c}
  label{display:block;font-size:.75rem;font-weight:600;margin:1rem 0 .4rem}
  .ph{display:flex;align-items:center;border:1px solid var(--tint);border-radius:1rem;overflow:hidden}
  .ph span{padding:0 .9rem;font-size:.9rem;font-weight:600;border-right:1px solid var(--tint);height:48px;display:flex;align-items:center;background:#fff8f8}
  input{width:100%;height:48px;border-radius:1rem;border:1px solid var(--tint);padding:0 1rem;font:inherit;color:var(--ink);background:#fff}
  .ph input{border:0;border-radius:0}
  input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
  .btn{margin-top:1.5rem;width:100%;height:48px;border:0;border-radius:9999px;background:var(--pc);color:#fff;font:600 .95rem 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s}
  .btn:hover{background:var(--primary);box-shadow:0 6px 20px rgba(212,175,55,.3)} .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--rose);margin-top:.75rem}
  .btn.danger{background:#fff;color:#ba1a1a;border:1.5px solid #ba1a1a} .btn.danger:hover{background:#ffdad6;box-shadow:none}
  #msg{margin-top:1rem;font-size:.82rem;text-align:center;min-height:1.1em} .err{color:#ba1a1a} .ok{color:#2e7d32}
  .row{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--tint);font-size:.88rem}
  .row b{text-align:right} .row span{color:#6b575c}
  .pill{display:inline-block;padding:.2rem .8rem;border-radius:9999px;font-size:.75rem;font-weight:700;background:var(--tint);color:var(--primary)}
  .note{margin-top:1rem;padding:.8rem 1rem;border-radius:1rem;background:#fff8e1;border:1px solid rgba(212,175,55,.4);font-size:.8rem}
  [hidden]{display:none!important}
</style></head>
<body>
<header><a href="/"><img src="/images/logo.png" alt="True Radiance Beauty Salon &amp; Spa Logo"/></a><a href="/">← Back to Home</a></header>
<main>
  <form class="card" id="find">
    <h1>Manage Your Booking</h1>
    <p class="sub">Enter the booking reference from your confirmation and the mobile number you booked with.</p>
    <label for="ref">Booking reference</label><input id="ref" placeholder="e.g. TR-8821" required autocomplete="off"/>
    <label for="phone">Mobile number</label>
    <div class="ph"><span>+63</span><input id="phone" type="tel" placeholder="9XX XXX XXXX" required/></div>
    <button class="btn" id="findBtn">Find my booking</button>
  </form>

  <section class="card" id="view" hidden>
    <h1 id="vTitle">Your booking</h1>
    <p class="sub"><span class="pill" id="vStatus"></span></p>
    <div id="vRows"></div>
    <div class="note" id="vNote" hidden></div>
    <button class="btn danger" id="cancelBtn" hidden>Cancel this booking</button>
    <button class="btn ghost" id="backBtn" type="button">Look up another booking</button>
  </section>
</main>
<div id="msg-wrap" style="text-align:center"><div id="msg"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const peso = (n) => '₱' + Number(n || 0).toLocaleString('en-PH');
const LABEL = { pending: 'Pending confirmation', confirmed: 'Confirmed', in_treatment: 'In treatment', completed: 'Completed', cancelled: 'Cancelled', no_show: 'No-show' };
let creds = {};
const say = (t, cls) => { $('msg').className = cls || ''; $('msg').textContent = t || ''; };
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Something went wrong.'); return d;
}
function show(b, paidNote) {
  const d = new Date(b.date + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  $('find').hidden = true; $('view').hidden = false;
  $('vTitle').textContent = '#' + b.ref; $('vStatus').textContent = LABEL[b.status] || b.status;
  const row = (k, v) => `<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`;
  $('vRows').innerHTML = row('Guest', b.guestName) + row('Service', b.serviceName) + row('Specialist', b.specialistName) +
    row('Date', d) + row('Time (PHT)', b.timeLabel) + row('Total', peso(b.totalAmount)) + row('Deposit due', peso(b.depositAmount));
  $('cancelBtn').hidden = !b.cancel.ok;
  const note = $('vNote');
  if (b.status === 'cancelled') { note.hidden = false; note.textContent = paidNote ? 'Your booking is cancelled. Because a payment was already recorded, our team will contact you about your deposit according to our cancellation policy.' : 'This booking is cancelled. You are welcome to book a new time anytime.'; }
  else if (!b.cancel.ok) { note.hidden = false; note.textContent = b.cancel.reason; }
  else note.hidden = true;
}
$('find').onsubmit = async (e) => {
  e.preventDefault(); say(''); $('findBtn').disabled = true;
  creds = { ref: $('ref').value, phone: '+63' + $('phone').value };
  try { show((await post('/api/bookings/lookup', creds)).booking); } catch (err) { say(err.message, 'err'); }
  $('findBtn').disabled = false;
};
$('cancelBtn').onclick = async () => {
  if (!confirm('Cancel this booking? This cannot be undone.')) return;
  $('cancelBtn').disabled = true; say('');
  try { const d = await post('/api/bookings/cancel', creds); show(d.booking, d.paidNote); say('Your booking has been cancelled.', 'ok'); }
  catch (err) { say(err.message, 'err'); }
  $('cancelBtn').disabled = false;
};
$('backBtn').onclick = () => { $('view').hidden = true; $('find').hidden = false; say(''); };
const q = new URLSearchParams(location.search).get('ref'); if (q) $('ref').value = q;
</script></body></html>
