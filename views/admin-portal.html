  <!-- Refined polish styles -->
  <style>
    /* Smooth transitions & refined scrollbar */
    * { transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff8f8; }
    h1, h2, h3, .font-headline-lg, .font-headline-md, .font-headline-sm, .font-display-lg {
      font-family: 'Playfair Display', serif;
    }
    /* Elegant custom scrollbar */
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: #dcc0c3; border-radius: 9999px; }
    aside::-webkit-scrollbar-thumb:hover { background: #b89a9e; }
    /* Material icons baseline alignment */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: font-variation-settings 0.25s ease, color 0.2s ease;
    }
    /* Active nav fill effect */
    a[aria-current="page"] .material-symbols-outlined,
    .nav-active .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Subtle glow on active items */
    .nav-active {
      box-shadow: 0 4px 16px -6px rgba(127, 24, 57, 0.2);
    }
    /* Refined button press */
    .btn-press:active { transform: scale(0.97); }
    /* New booking button hover shimmer */
    .btn-shimmer {
      background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 2.2s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    /* Card lift */
    .hover-lift {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -16px rgba(127, 24, 57, 0.12);
    }
    /* Sidebar bottom status pulse refinement */
    .status-dot {
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Enhanced skeleton shimmer for loading state */
    @keyframes skeleton-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #fae2e9 25%, #fff0f3 50%, #fae2e9 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.6s infinite ease-in-out;
    }

    /* Elegant focus rings */
    a:focus-visible, button:focus-visible {
      outline: 2px solid #7f1839;
      outline-offset: 3px;
      border-radius: 9999px;
    }

    /* Soft glow on primary button */
    .btn-glow {
      box-shadow: 0 4px 20px -6px rgba(127, 24, 57, 0.3);
    }
    .btn-glow:hover {
      box-shadow: 0 6px 28px -6px rgba(127, 24, 57, 0.4);
    }

    /* Sidebar container subtle backdrop */
    aside {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 248, 248, 0.92);
    }

    /* Improved nav item hover */
    nav a:not(.nav-active):hover .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Card top accent */
    .card-accent {
      position: relative;
      overflow: hidden;
    }
    .card-accent::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #9e3150, #ff93ad, #cca730);
      border-radius: 0 0 4px 4px;
      opacity: 0.7;
    }

    /* Scroll margin for main content */
    main {
      scroll-margin-top: 2rem;
    }

    /* Refined selection */
    ::selection {
      background: #ffd9e0;
      color: #3f0018;
    }

          <span class="material-symbols-outlined text-xl" data-icon="group">group</span>

        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container rounded-full font-medium transition-colors duration-150 active:scale-[0.99]" href="#settings">
          <span class="material-symbols-outlined text-xl" data-icon="settings">settings</span>
          <span class="text-label-md font-label-md">Settings</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Footer Navigation in Sidebar -->
    <div class="flex flex-col gap-1 border-t border-outline-variant/25 pt-4">
      <div class="px-3 py-2 flex items-center gap-2 mb-1 bg-surface-container-low/60 rounded-lg">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 status-dot"></span>

      </div>
      <a class="flex items-center gap-3 px-4 py-2.5 text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container rounded-full font-medium text-label-md font-label-md transition-colors duration-150" href="#help">
        <span class="material-symbols-outlined text-lg" data-icon="help">help</span>

      <a class="flex items-center gap-3 px-4 py-2.5 text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container rounded-full font-medium text-label-md font-label-md transition-colors duration-150" href="#logout">
        <span class="material-symbols-outlined text-lg" data-icon="logout">logout</span>
        <span>Log Out</span>
      </a>
    </div>

  <!-- MAIN CONTENT AREA                          -->
  <!-- ========================================== -->
  <main class="ml-64 lg:ml-72 flex-1 min-h-screen bg-background flex flex-col p-6 lg:p-10 gap-8 max-w-[1520px]">

    <div id="app" class="flex flex-col gap-6">

      <!-- Enhanced loading state with skeleton shimmer -->
      <div class="flex flex-col gap-6" aria-busy="true" aria-label="Loading dashboard content">

        <!-- Header skeleton -->
        <div class="flex items-center justify-between">
          <div class="h-9 w-56 rounded-full skeleton-shimmer"></div>
          <div class="h-9 w-24 rounded-full skeleton-shimmer"></div>
        </div>

        <!-- Stat cards skeleton -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="h-32 rounded-2xl skeleton-shimmer card-accent"></div>
          <div class="h-32 rounded-2xl skeleton-shimmer card-accent"></div>
          <div class="h-32 rounded-2xl skeleton-shimmer card-accent"></div>
          <div class="h-32 rounded-2xl skeleton-shimmer card-accent"></div>
        </div>

        <!-- Chart skeleton -->
